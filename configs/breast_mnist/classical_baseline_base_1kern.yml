dataset:
  name: breast_mnist
  data_root: ./data
  batch_size: 32
  num_workers: 2
  download: true
  color_space: GRAYSCALE

model:
  architecture: classical_baseline
  num_classes: 2
  in_channels: 1
  kernel_size: 3
  stride: 3
  out_channels: 45  # Matches 1-kernel ZZ (9 Z + 36 ZZ features)
  dropout: 0.5
  activation: relu
  head_hidden_channels: 64

optim:
  lr: 0.001
  weight_decay: 1e-4
  epochs: 100
  grad_clip: 5.0
  patience: 20
  use_scheduler: true

misc:
  seed: [42]
  log_every: 50
