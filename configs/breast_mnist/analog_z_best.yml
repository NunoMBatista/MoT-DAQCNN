# breast_mnist capacity-sweep best-config (topology = linear-probe AUC winner)
dataset:
  name: breast_mnist
  data_root: ./data
  batch_size: 64
  num_workers: 2
  download: true
  color_space: GRAYSCALE
model:
  num_classes: 2
  kernel_size: 3
  stride: 3
  kernel_topology_names: ["horizontal"]
  scaling_factor: 1.0
  evolution_time: 2.5
  mode: trotter
  encoding_mode: "analog"
  include_correlators: false
  quantum_device: default.qubit
  classical_device: auto
