# BreastMNIST end-to-end on poly-2 features, via the classical-feature cache.
# architecture "original" + the poly2 cache => find_cached matches, bypass_quantum
# is set, and the CNN head trains on the cached 45-dim poly-2 features through the
# identical path as the quantum table rows. Topology name "poly2" is synthetic and
# only exists to match the cache; include_correlators=false matches the cache meta.
dataset:
  name: breast_mnist
  data_root: ./data
  batch_size: 32
  num_workers: 2
  download: true
  color_space: GRAYSCALE

model:
  architecture: "original"
  num_classes: 2
  kernel_size: 3
  stride: 3
  kernel_topology_names: ["poly2"]
  scaling_factor: 1.0
  evolution_time: 2.5
  mode: trotter
  encoding_mode: "digital"
  include_correlators: false
  dropout: 0.5
  activation: gelu
  quantum_device: default.qubit
  classical_device: auto

optim:
  lr: 0.0001
  weight_decay: 0.000001
  epochs: 100
  grad_clip: 1.0
  patience: 15
  use_scheduler: true
  scheduler_T_max: 100
  scheduler_eta_min: 0.0

misc:
  seed: [0, 1, 2, 3, 4]
  log_every: 50
