# =============================================================================
# Fair Comparison HP Search — Analog + ZZ (8-Kernels) on BreastMNIST
# =============================================================================
# Uses all 8 fixed kernels. Classical ranges match the 4-kernel search exactly.

settings:
  metric: val_acc
  direction: maximize
  study_name: "analog_zz_8kern_fair"

search_space:
  # === Optimizer (Exact match to 4-kernel search) ===
  optim.lr:
    type: loguniform
    low:  1.0e-8
    high: 5.0e-3

  optim.weight_decay:
    type: loguniform
    low:  1.0e-8
    high: 1.0e-3

  optim.grad_clip:
    type: uniform
    low:  0.0
    high: 10.0

  optim.patience:
    type: int
    low:  1
    high: 100
    step: 5

  optim.use_scheduler:
    type: categorical
    choices: [true, false]

  # === Model / Head ===
  model.dropout:
    type: uniform
    low:  0.0
    high: 0.7

  model.activation:
    type: categorical
    choices: ["relu", "gelu"]

  # === Dataset ===
  dataset.batch_size:
    type: categorical
    choices: [16, 32, 64]
