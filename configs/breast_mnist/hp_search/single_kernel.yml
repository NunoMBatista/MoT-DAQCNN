# =============================================================================
# Hyperparameter Search — Single-Kernel DAQCNN, Digital Z-only on BreastMNIST
# =============================================================================
# Matches the search space of digital_zz_single_kernel_search.yml exactly,
# except topology choices and the absence of ZZ correlators (set in base config).

settings:
  metric: val_acc
  direction: maximize
  study_name: "digital_z_single_kernel_fair"

search_space:
  # === Topology Selection (all 8 geometries, same as ZZ searches) ===
  model.kernel_topology_names:
    type: categorical
    choices:
      - ["kings"]
      - ["horizontal"]
      - ["vertical"]
      - ["cross"]
      - ["ring"]
      - ["chain"]
      - ["star"]
      - ["grid"]

  # === Optimizer (exact match to other quantum searches) ===
  optim.lr:
    type: loguniform
    low:  1.0e-8
    high: 5.0e-3

  optim.weight_decay:
    type: loguniform
    low:  1.0e-8
    high: 1.0e-3

  optim.grad_clip:
    type: uniform
    low:  0.0
    high: 10.0

  optim.patience:
    type: int
    low:  1
    high: 100
    step: 5

  optim.use_scheduler:
    type: categorical
    choices: [true, false]

  # === Model / Head ===
  model.dropout:
    type: uniform
    low:  0.0
    high: 0.7

  model.activation:
    type: categorical
    choices: ["relu", "gelu"]

  # === Dataset ===
  dataset.batch_size:
    type: categorical
    choices: [16, 32, 64]
