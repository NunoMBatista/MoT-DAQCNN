# =============================================================================
# Hyperparameter Search — Original DAQCNN on BreastMNIST (Best 3 + 1 Diverse)
# =============================================================================
#
# Base config:
#   configs/breast_mnist_multi_seed_4_kernels_best3_plus1_diverse_3x3.yml
#
# This search keeps the known best trio fixed:
#   ["grid", "chain", "horizontal"]
# and tunes the 4th kernel by choosing one diverse topology from a list.
#
# Usage:
#   python experiments/hyperparameter_search.py \
#       --config configs/breast_mnist_multi_seed_4_kernels_best3_plus1_diverse_3x3.yml \
#       --search-config configs/hp_search/breast_mnist_original_best3_plus1_diverse_4kern.yml \
#       --n-trials 200

settings:
  metric: test_acc
  direction: maximize
  study_name: hp_original_breastmnist_best3_plus1_diverse

search_space:
  # === Optimizer ===
  optim.lr:
    type: loguniform
    low: 1.0e-8
    high: 5.0e-3
      
  optim.weight_decay:
    type: loguniform
    low: 1.0e-8
    high: 1.0e-3
  
  optim.grad_clip:
    type: uniform
    low: 0.0
    high: 10.0
  
  optim.patience:
    type: int
    low: 1
    high: 100
    step: 5
  
  optim.use_scheduler:
    type: categorical
    choices: [true, false]
  
  # === Model ===
  model.dropout:
    type: uniform
    low: 0.0
    high: 0.7
  
  model.activation:
    type: categorical
    choices: ["relu", "gelu"]
  
  # === Dataset ===
  dataset.batch_size:
    type: categorical
    choices: [16, 32, 64, 128, 256]
  
  # === Kernel topology set ===
  # Keep [grid, chain, horizontal] fixed and select the 4th kernel from a diverse list.
  model.kernel_topology_names:
    type: categorical
    choices:
    - ["grid", "chain", "horizontal", "kings"]
    - ["grid", "chain", "horizontal", "vertical"]
    - ["grid", "chain", "horizontal", "cross"]
    - ["grid", "chain", "horizontal", "ring"]
    - ["grid", "chain", "horizontal", "star"]
