# =============================================================================
# Hyperparameter Search — TS-MoE on BreastMNIST (Best 3 + 1 Diverse)
# =============================================================================
#
# Base config:
#   configs/breast_mnist_ts_moe_4_kernels_best3_plus1_diverse_3x3.yml
#
# This search keeps the known best trio fixed:
#   ["grid", "chain", "horizontal"]
# and tunes the 4th kernel by choosing one diverse topology from a list.

settings:
  metric: test_acc
  direction: maximize
  study_name: hp_tsmoe_breastmnist_best3_plus1_diverse

search_space:
  # =========================================================================
  # Phase 1: Teacher — Optimizer
  # =========================================================================
  optim.lr:
    type: loguniform
    low:  1.0e-8
    high: 5.0e-3

  optim.weight_decay:
    type: loguniform
    low:  1.0e-8
    high: 1.0e-3

  optim.grad_clip:
    type: uniform
    low:  0.0
    high: 10.0

  optim.patience:
    type: int
    low:  1
    high: 100
    step: 5

  optim.use_scheduler:
    type: categorical
    choices: [true, false]

  # =========================================================================
  # Phase 1: Teacher — Model / Head
  # =========================================================================
  model.dropout:
    type: uniform
    low:  0.0
    high: 0.7

  model.activation:
    type: categorical
    choices: ["relu", "gelu"]

  # =========================================================================
  # Phase 1: Teacher — Entropy Regularisation
  # =========================================================================
  ts_moe.lambda_max:
    type: loguniform
    low:  0.01
    high: 2.0

  ts_moe.lambda_warmup_epochs:
    type: int
    low:  0
    high: 100
    step: 10

  ts_moe.lambda_entropy_start:
    type: uniform
    low:  0.0
    high: 1.0

  ts_moe.attention_hidden_dim:
    type: categorical
    choices: [16, 32, 64, 128, 256]

  ts_moe.attention_gate_zero_init:
    type: categorical
    choices: [true, false]

  # =========================================================================
  # Phase 2: Student Gatekeeper
  # =========================================================================
  ts_moe.student_hidden_dims:
    type: categorical
    choices: [[32, 16], [64, 32], [128, 64], [256, 128, 64], [512, 256, 128]]

  ts_moe.student_lr:
    type: loguniform
    low:  1.0e-4
    high: 1.0e-2

  ts_moe.student_epochs:
    type: int
    low:  5
    high: 60
    step: 5

  ts_moe.student_weighted_ce:
    type: categorical
    choices: [true, false]

  ts_moe.student_balanced_sampler:
    type: categorical
    choices: [true, false]

  ts_moe.confidence_threshold:
    type: uniform
    low:  0.0
    high: 1.0

  ts_moe.student_kd_alpha:
    type: uniform
    low:  0.0
    high: 1.0

  ts_moe.student_kd_temperature:
    type: uniform
    low:  1.0
    high: 8.0

  ts_moe.student_features_stats:
    type: categorical
    choices: [true, false]

  ts_moe.student_features_range_energy:
    type: categorical
    choices: [true, false]

  ts_moe.student_features_gradients:
    type: categorical
    choices: [true, false]

  # =========================================================================
  # Phase 3: Final Classifier
  # =========================================================================
  ts_moe.final_lr:
    type: loguniform
    low:  1.0e-8
    high: 5.0e-3

  ts_moe.final_epochs:
    type: int
    low:  10
    high: 150
    step: 10

  ts_moe.use_mask_channel:
    type: categorical
    choices: [true, false]

  # =========================================================================
  # Dataset
  # =========================================================================
  dataset.batch_size:
    type: categorical
    choices: [16, 32, 64]

  # =========================================================================
  # Kernel topology set
  # =========================================================================
  # Keep [grid, chain, horizontal] fixed and select the 4th kernel from a diverse list.
  model.kernel_topology_names:
    type: categorical
    choices:
      - ["grid", "chain", "horizontal", "kings"]
      - ["grid", "chain", "horizontal", "vertical"]
      - ["grid", "chain", "horizontal", "cross"]
      - ["grid", "chain", "horizontal", "ring"]
      - ["grid", "chain", "horizontal", "star"]