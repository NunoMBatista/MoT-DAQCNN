# A9 evolution-time sweep: breast_mnist, analog encoding, T = 1.0
# Three topologies only (val-selected best per encoding + kings reference).
dataset:
  name: breast_mnist
  color_space: GRAYSCALE
  batch_size: 8

model:
  kernel_size: 3
  stride: 3
  kernel_topology_names: ['kings', 'cross', 'star']
  scaling_factor: 1.0
  evolution_time: 1.0
  mode: trotter
  encoding_mode: analog
  include_correlators: true
  quantum_device: lightning.qubit
