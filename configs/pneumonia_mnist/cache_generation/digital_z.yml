# PneumoniaMNIST with Digital Encoding, no ZZ correlators
# Purpose: Generate a cache with 9 channels per topology (Z-only).

dataset:
  name: pneumonia_mnist
  color_space: GRAYSCALE
  batch_size: 8

model:
  kernel_size: 3
  stride: 3
  kernel_topology_names: ["kings", "horizontal", "vertical", "cross", "ring", "chain", "star", "grid"]
  scaling_factor: 1.0
  evolution_time: 2.5
  mode: trotter
  encoding_mode: digital
  include_correlators: false
  quantum_device: default.qubit
