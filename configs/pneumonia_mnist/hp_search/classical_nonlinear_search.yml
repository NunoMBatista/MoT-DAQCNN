# HP search for the classical-nonlinear end-to-end rows (poly-2 / RFF).
# Identical to the quantum single-kernel search MINUS the topology categorical
# (these sources have no topology), so the training-HP space is matched.
settings:
  metric: val_acc
  direction: maximize
  study_name: "classical_nonlinear_endtoend"

search_space:
  optim.lr:
    type: loguniform
    low:  1.0e-8
    high: 5.0e-3
  optim.weight_decay:
    type: loguniform
    low:  1.0e-8
    high: 1.0e-3
  optim.grad_clip:
    type: uniform
    low:  0.0
    high: 10.0
  optim.patience:
    type: int
    low:  1
    high: 100
    step: 5
  optim.use_scheduler:
    type: categorical
    choices: [true, false]
  model.dropout:
    type: uniform
    low:  0.0
    high: 0.7
  model.activation:
    type: categorical
    choices: ["relu", "gelu"]
  dataset.batch_size:
    type: categorical
    choices: [16, 32, 64]
