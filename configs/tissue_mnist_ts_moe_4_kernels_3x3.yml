# TissueMNIST with Teacher-Student Mixture-of-Topologies (TS-MoE) — 3×3 kernels
#
# This config runs the full TS-MoE pipeline:
#   Phase 1: Teacher with Kernel Channel Attention routing over all 4 kernels
#   Phase 2: Student gatekeeper distilled from Teacher
#   Phase 3: Final classifier on sparse routed features
#
# Dataset properties:
#   Task:       8-class multi-class (kidney tissue histology)
#   Resolution: 28×28 grayscale
#   n_train:    165,466   n_val: 23,640   n_test: 47,280
#   Imbalance:  9.0× (Collecting Duct: 53k vs Glomerular: 5.9k)
#
# Quantum feature map:
#   3×3 kernel, stride 3 → 9×9 = 81 spatial positions per image
#   4 topologies × 9 qubits = 36 channels total
#
# Key differences vs binary datasets (breast/pneumonia):
#
#   8-class classification
#     → higher Teacher LR and more epochs to converge
#     → attention_hidden_dim: 64 (more capacity to separate 4 routing targets
#       across 8 tissue classes)
#     → student_agreement_threshold: 0.85 (routing 4 kernels across 8 classes
#       is harder; 0.90 is too strict here)
#
#   9× class imbalance
#     → student_weighted_ce: true  (penalise rare classes more)
#     → student_balanced_sampler: true  (both together for 9× imbalance)
#     → batch_size: 64  (larger batches to see all 8 classes per step)
#
#   165k training images → 13.4M patches total
#     → student_batch_size: 1024  (amortise overhead over more patches)
#     → student_epochs: 20  (each epoch = 13k batches; 20 epochs is ample)
#     → Teacher epochs: 60  (each epoch already covers 165k images)
#
#   uniform alpha = 1/4 = 0.25 with 4 kernels
#     → confidence_threshold: 0.30  (only 20% above uniform; removes
#       flattest routing decisions without over-filtering)

dataset:
    name: tissue_mnist
    data_root: ./data
    batch_size: 64 # larger batch — 165k images, GPU handles it
    num_workers: 4
    download: true
    color_space: GRAYSCALE

model:
    architecture: "TS-MoE"
    num_classes: 8
    kernel_size: 3
    stride: 3
    kernel_topology_names: ["kings", "horizontal", "cross", "ring"]
    scaling_factor: 1
    evolution_time: 2.5
    mode: trotter
    dropout: 0.5
    activation: gelu
    quantum_device: default.qubit
    quantum_device_kwargs: {}
    classical_device: auto

# Teacher-Student MoE parameters
ts_moe:
    # -----------------------------------------------------------------------
    # Phase 1: Teacher training
    # -----------------------------------------------------------------------

    # Delay entropy penalty: let the Teacher learn 8-class CE first before
    # being pushed toward decisive routing decisions.
    lambda_start_epoch: 10
    lambda_entropy_start: 0.0
    lambda_max: 0.5 # gentle push — tissue classes are subtler than binary
    lambda_warmup_epochs: 30 # reach lambda_max by epoch 40

    # More capacity than binary configs: 36 channels, 8 output classes, 4 routing
    # targets — the gate needs enough width to disentangle tissue-specific routing.
    attention_hidden_dim: 64

    # Zero-init so all 4 kernels start with equal alpha (1/4 = 0.25).
    # Data gradients break symmetry once the Teacher starts learning tissue classes.
    attention_gate_zero_init: true

    # -----------------------------------------------------------------------
    # Phase 2: Student gatekeeper
    #
    # patch_dim = 1 × 3² = 9 raw pixels
    # With all three augmentation groups: +4 stats, +3 range_energy, +3 gradients
    # → effective input dim = 19
    # -----------------------------------------------------------------------

    # --- Model capacity ---
    student_hidden_dims: [128, 64]

    # --- Training schedule ---
    # Each epoch = 165466 * 81 / 1024 ≈ 13k batches — keep epochs low.
    student_epochs: 20
    student_lr: 1e-3
    student_batch_size: 1024 # large batch to amortise 13M-patch dataset

    # Relaxed threshold: routing 4 kernels across 8 tissue classes is harder
    # than binary; 0.85 is a realistic target without early stopping too soon.
    student_agreement_threshold: 0.85
    student_agreement_patience: 5

    # -----------------------------------------------------------------------
    # Label imbalance — 9× ratio makes this critical
    # -----------------------------------------------------------------------
    student_weighted_ce: true # penalise rare tissue classes
    student_balanced_sampler: true # combined with weighted_ce for 9× imbalance

    # -----------------------------------------------------------------------
    # Noisy label filtering
    # -----------------------------------------------------------------------

    # uniform alpha = 0.25 with 4 kernels; 0.30 removes only the flattest patches
    confidence_threshold: 0.30

    # Soft KD: blend hard labels with Teacher's full routing distribution.
    student_kd_alpha: 0.5
    student_kd_temperature: 4.0

    # -----------------------------------------------------------------------
    # Patch feature augmentation
    # -----------------------------------------------------------------------
    student_features_stats: true # mean, std, min, max  (+4)
    student_features_range_energy: true # range, L2, L1        (+3)
    student_features_gradients: true # h-grad, v-grad, mag  (+3)

    # -----------------------------------------------------------------------
    # Phase 3: Final classifier
    # -----------------------------------------------------------------------
    use_mask_channel: false
    final_epochs: 80 # 8-class head needs more epochs than binary
    final_lr: 1e-4

# Optimizer — Teacher (Phase 1) only.
optim:
    lr: 1e-4
    weight_decay: 1e-6 # slightly stronger than binary — large dataset
    epochs: 100
    grad_clip: 1.0
    patience: 15
    use_scheduler: true
    scheduler_T_max: 100
    scheduler_eta_min: 1e-6

misc:
    seed: [343, 4123, 10, 131, 1541, 1354, 635, 5213, 63256, 62554, 655, 12542]
    log_every: 50
