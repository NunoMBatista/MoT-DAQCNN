# =============================================================================
# Hyperparameter Search — Teacher-Student MoE on TissueMNIST
# =============================================================================
#
# Base config: configs/tissue_mnist_ts_moe_3kern.yml
#
# The TS-MoE pipeline has three phases (Teacher → Student → Final Classifier),
# each with its own hyperparameters.  This search covers the most impactful
# ones across all phases.
#
# TissueMNIST specifics:
#   - 8 classes (vs 2 for breast/pneumonia)
#     → Teacher needs more capacity & epochs to converge
#     → Student has harder 4-way classification (4 kernels across 8 tissue types)
#   - 165k training images → 13.4M patches total
#     → Student can use larger batch size (1024–2048)
#     → Each Teacher epoch already covers 165k images (vs 600–5k)
#   - 9× class imbalance
#     → Student weighted CE + balanced sampler both needed
#     → Confidence threshold should be tuned carefully (uniform = 0.25 for 4 kernels)
#
# Quantum parameters (kernel_size, stride, evolution_time, topology names)
# are left fixed because they require regenerating the quantum dataset
# cache.  Tune them manually or in a separate outer loop.
#
# Usage:
#   python experiments/hyperparameter_search.py \
#       --config configs/tissue_mnist_ts_moe_3kern.yml \
#       --search-config configs/hp_search/tissue_mnist_ts_moe.yml \
#       --n-trials 100
#
# After the search finishes the best config is exported to
#   outputs/hp_search_TS-MoE_tissuemnist_<timestamp>/best_config.yml
# which you can run with:
#   python experiments/robust_test_original_daqcnn.py --config <best_config.yml>

# ----- Search settings -----
settings:
  metric: test_acc          # optimise for final classifier test accuracy
  direction: maximize       # higher is better
  study_name: null          # auto-generated from architecture + dataset

# ----- Search space -----
# Each key is a dotted path into the base config.
# Supported types: uniform, loguniform, int, categorical, fixed
search_space:

  # =========================================================================
  # Phase 1: Teacher — Optimizer
  # =========================================================================

  # Learning rate for the Teacher.
  # 8-class tasks need slightly higher LRs than binary.
  optim.lr:
    type: loguniform
    low:  1.0e-5
    high: 1.0e-2

  # Weight decay — L2 regularisation on Teacher parameters.
  # Important for 165k images with class imbalance.
  optim.weight_decay:
    type: loguniform
    low:  1.0e-8
    high: 1.0e-4

  # Gradient clipping — prevents exploding gradients during Teacher training.
  optim.grad_clip:
    type: uniform
    low:  0.5
    high: 5.0

  # Early-stopping patience for the Teacher phase.
  # 8-class convergence is slower, so allow more patience.
  optim.patience:
    type: int
    low:  10
    high: 30
    step: 5

  # Whether to use cosine annealing LR scheduler for the Teacher.
  optim.use_scheduler:
    type: categorical
    choices: [true, false]

  # =========================================================================
  # Phase 1: Teacher — Model / Head
  # =========================================================================

  # Dropout in the shared classification head.
  # Affects Teacher and Final Classifier identically (shared architecture).
  model.dropout:
    type: uniform
    low:  0.3
    high: 0.7

  # Activation function for the classification head.
  model.activation:
    type: categorical
    choices: ["relu", "gelu"]

  # =========================================================================
  # Phase 1: Teacher — Entropy Regularisation
  # =========================================================================

  # These control how strongly and how quickly the Teacher is pushed toward
  # decisive (one-hot) routing.  For 8-class tasks with 4 kernels, the
  # interaction is more complex than binary classification.

  # Maximum entropy regularisation weight.
  # Higher -> stronger push toward decisive routing.
  # Too high -> routing collapses before the classifier learns.
  ts_moe.lambda_max:
    type: loguniform
    low:  0.01
    high: 2.0

  # Number of epochs over which to linearly ramp lambda from start to max.
  # 8-class tasks need longer warmup for the head to learn.
  ts_moe.lambda_warmup_epochs:
    type: int
    low:  20
    high: 100
    step: 10

  # Starting value of lambda.  Usually 0 (no penalty initially).
  ts_moe.lambda_entropy_start:
    type: uniform
    low:  0.0
    high: 0.1

  # Hidden dimension of the grouped SE attention gate.
  # For 8-class tasks, we need more capacity to separate 4 routing targets.
  ts_moe.attention_hidden_dim:
    type: categorical
    choices: [32, 64, 128]

  # Zero-init the last gate layer so initial alphas are uniform (1/M).
  # Prevents early routing bias.
  ts_moe.attention_gate_zero_init:
    type: categorical
    choices: [true, false]

  # =========================================================================
  # Phase 2: Student Gatekeeper
  # =========================================================================

  # Student MLP hidden layer sizes.
  # 8-class task → 4-way kernel routing is harder, so we search larger capacities.
  ts_moe.student_hidden_dims:
    type: categorical
    choices: [[64, 32], [128, 64], [256, 128]]

  # Student learning rate.
  ts_moe.student_lr:
    type: loguniform
    low:  5.0e-5
    high: 5.0e-3

  # Student training epochs.
  # With 13.4M patches, each epoch is very long, so fewer epochs suffice.
  ts_moe.student_epochs:
    type: int
    low:  10
    high: 40
    step: 5

  # --- Handling label imbalance ---
  # 9× class imbalance means weighted CE is critical.
  ts_moe.student_weighted_ce:
    type: categorical
    choices: [true, false]

  # Balanced sampler helps ensure all kernel classes appear per batch.
  ts_moe.student_balanced_sampler:
    type: categorical
    choices: [true, false]

  # --- Handling noisy labels ---
  # Confidence threshold: discard patches where max(Teacher alpha) < threshold.
  # With 4 kernels, uniform = 0.25.  We search around this.
  ts_moe.confidence_threshold:
    type: uniform
    low:  0.15
    high: 0.5

  # Knowledge distillation alpha: weight of soft KL term vs hard CE.
  # 0.0 = hard labels only.  1.0 = soft labels only.
  ts_moe.student_kd_alpha:
    type: uniform
    low:  0.0
    high: 1.0

  # KD temperature: higher = softer targets, more inter-class info transfer.
  # For 8-class tasks, higher temps may help.
  ts_moe.student_kd_temperature:
    type: uniform
    low:  1.0
    high: 10.0

  # --- Feature augmentation flags ---
  # These toggle extra scalar features appended to the raw pixel vector.
  # They're cheap to compute and can dramatically help the Student.

  ts_moe.student_features_stats:
    type: categorical
    choices: [true, false]

  ts_moe.student_features_range_energy:
    type: categorical
    choices: [true, false]

  ts_moe.student_features_gradients:
    type: categorical
    choices: [true, false]

  # =========================================================================
  # Phase 3: Final Classifier
  # =========================================================================

  # Learning rate for the final classifier phase.
  ts_moe.final_lr:
    type: loguniform
    low:  1.0e-5
    high: 1.0e-2

  # Number of training epochs for the final classifier.
  # 8-class tasks may need more epochs.
  ts_moe.final_epochs:
    type: int
    low:  60
    high: 180
    step: 20

  # Whether to append the binary routing mask as an extra input channel.
  ts_moe.use_mask_channel:
    type: categorical
    choices: [true, false]

  # =========================================================================
  # Dataset
  # =========================================================================

  # Batch size — with 165k images, we can afford larger batches.
  # Larger batches help see all 8 classes per update.
  dataset.batch_size:
    type: categorical
    choices: [32, 64, 128]
