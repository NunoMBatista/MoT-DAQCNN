dataset:
    name: tissue_mnist
    data_root: ./data
    batch_size: 32
    num_workers: 2
    download: true
    color_space: GRAYSCALE

model:
    architecture: "oracle-routed"
    num_classes: 8
    kernel_size: 3
    stride: 3
    kernel_topology_names: ["kings", "cross", "star", "grid"]
    scaling_factor: 1.0
    evolution_time: 2.5
    mode: trotter
    dropout: 0.6
    activation: gelu
    quantum_device: default.qubit
    quantum_device_kwargs: {}
    classical_device: auto

optim:
    lr: 0.0001
    weight_decay: 1e-7
    epochs: 100
    grad_clip: 1.0
    patience: 10
    use_scheduler: true
    scheduler_T_max: 100
    scheduler_eta_min: 0.0

oracle_router:
    # Phase 2: image-level router
    router_hidden_dims: [16, 32]
    router_fc_dim: 64
    router_dropout: 0.3
    router_lr: 0.001
    router_weight_decay: 0.00001
    router_epochs: 30
    router_patience: 10

misc:
    seed: [0, 1, 2, 3, 4]
    log_every: 50
