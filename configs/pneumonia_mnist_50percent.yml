dataset:
  name: pneumonia_mnist
  data_root: ./data
  batch_size: 32
  num_workers: 2
  download: true
  subset_percent: 50  # Use only 50% of the training/validation data

model:
  num_classes: 2
  kernel_size: 2
  stride: 1
  kernel_topology_names: ["kings", "horizontal", "vertical", "square"]
  scaling_factor: 1.0
  evolution_time: 0.2
  mode: trotter
  dropout: 0.1
  activation: relu
  quantum_device: default.qubit
  quantum_device_kwargs: {}
  classical_device: auto

optim:
  lr: 1e-3
  weight_decay: 0.0
  epochs: 10
  grad_clip: 1.0
  patience: 5
  use_scheduler: false
  scheduler_T_max: 10
  scheduler_eta_min: 0.0

misc:
  seed: 0
  log_every: 50
