# =============================================================================
# Hyperparameter Search — Gumbel-Softmax MoE on BreastMNIST
# =============================================================================
#
# Base config: configs/breast_mnist_gumbel_3kern.yml
#
# The Gumbel-Softmax MoE pipeline has several unique hyperparameters
# controlling the router network, temperature annealing schedule, budget
# loss weighting, and hard-switching behaviour.  These interact in
# non-obvious ways, making Bayesian HP search especially valuable.
#
# Quantum parameters (kernel_size, stride, evolution_time, topology names)
# are left fixed because they require regenerating the quantum dataset
# cache.  Tune them manually or in a separate outer loop.
#
# Usage:
#   python experiments/hyperparameter_search.py \
#       --config configs/breast_mnist_gumbel_3kern.yml \
#       --search-config configs/hp_search/breast_mnist_gumbel.yml \
#       --n-trials 80
#
# After the search finishes the best config is exported to
#   outputs/hp_search_gumbel_breastmnist_<timestamp>/best_config.yml
# which you can run with:
#   python experiments/robust_test_original_daqcnn.py --config <best_config.yml>

# ----- Search settings -----
settings:
  metric: test_acc          # optimise for test accuracy
  direction: maximize       # higher is better
  study_name: null          # auto-generated from architecture + dataset

# ----- Search space -----
# Each key is a dotted path into the base config.
# Supported types: uniform, loguniform, int, categorical, fixed
search_space:

  # =========================================================================
  # Optimizer
  # =========================================================================

  # Learning rate — most impactful HP across all pipelines.
  optim.lr:
    type: loguniform
    low:  1.0e-5
    high: 5.0e-3

  # Weight decay — L2 regularisation.
  optim.weight_decay:
    type: loguniform
    low:  1.0e-8
    high: 1.0e-3

  # Gradient clipping — important for Gumbel because the STE gradient
  # can spike when temperature is very low.
  optim.grad_clip:
    type: uniform
    low:  0.5
    high: 5.0

  # Early-stopping patience — Gumbel models sometimes plateau then
  # improve after the hard switch, so a slightly longer patience helps.
  optim.patience:
    type: int
    low:  5
    high: 30
    step: 5

  # Whether to use cosine annealing LR scheduler.
  # Gumbel already has its own temperature schedule, so an LR schedule
  # on top may or may not help — worth searching.
  optim.use_scheduler:
    type: categorical
    choices: [true, false]

  # =========================================================================
  # Model (classical head)
  # =========================================================================

  # Dropout in the classification head.
  model.dropout:
    type: uniform
    low:  0.2
    high: 0.7

  # Activation function.
  model.activation:
    type: categorical
    choices: ["relu", "gelu"]

  # =========================================================================
  # Gumbel-specific parameters
  # =========================================================================

  # --- Budget / sparsity loss ---
  # Lambda weighting for the L1 budget penalty on routing probabilities.
  # Too high -> forces degenerate routing (always picks one kernel).
  # Too low  -> no incentive to specialise.
  gumbel.sparsity_weight:
    type: loguniform
    low:  1.0e-4
    high: 0.5

  # --- Temperature annealing ---
  # Initial Gumbel temperature.  Higher = softer exploration at start.
  gumbel.tau_start:
    type: uniform
    low:  0.5
    high: 5.0

  # Final Gumbel temperature.  Lower = more discrete / closer to argmax.
  gumbel.tau_end:
    type: loguniform
    low:  0.01
    high: 0.5

  # Number of epochs over which temperature decays exponentially from
  # tau_start to tau_end.  Controls how quickly the model commits.
  gumbel.tau_anneal_epochs:
    type: int
    low:  30
    high: 100
    step: 10

  # --- Hard switching ---
  # Epoch after which to switch to hard (one-hot) routing via STE.
  # Setting this very high effectively keeps soft routing the whole time.
  gumbel.hard_after_epoch:
    type: int
    low:  40
    high: 120
    step: 10

  # =========================================================================
  # Dataset
  # =========================================================================

  # Batch size — affects gradient noise.  Gumbel sampling adds its own
  # stochasticity, so larger batches can stabilise training.
  dataset.batch_size:
    type: categorical
    choices: [16, 32, 64]
