# BreastMNIST with Teacher-Student Mixture-of-Topologies (TS-MoE)
#
# This config runs the full TS-MoE pipeline:
#   Phase 1: Teacher with Grouped SE routing over all kernels
#   Phase 2: Student gatekeeper distilled from Teacher
#   Phase 3: Final classifier on sparse routed features

dataset:
    name: breast_mnist
    data_root: ./data
    batch_size: 32
    num_workers: 2
    download: true
    color_space: GRAYSCALE

model:
    architecture: "TS-MoE" # "original" for DAQCNN, "TS-MoE" for Teacher-Student pipeline
    num_classes: 2
    kernel_size: 3
    stride: 3
    # Fixed best trio + one diverse kernel (search config tunes the 4th choice).
    kernel_topology_names: ["grid", "chain", "horizontal", "kings"]
    scaling_factor: 1
    evolution_time: 2.5
    mode: trotter
    dropout: 0.6
    activation: gelu
    quantum_device: default.qubit
    quantum_device_kwargs: {}
    classical_device: auto

# Teacher-Student MoE parameters
ts_moe:
    # -----------------------------------------------------------------------
    # Phase 1: Teacher training
    # -----------------------------------------------------------------------
    lambda_start_epoch: 0
    lambda_entropy_start: 0.0 # entropy regularisation weight on Teacher routing (prevents collapse)
    lambda_max: 0.5 # max-alpha regularisation weight (encourages confident routing)
    lambda_warmup_epochs: 50 # ramp lambda_entropy/lambda_max up over this many epochs
    attention_hidden_dim: 32 # Attention gate hidden dim; null = auto (total_channels // 2)
    attention_gate_zero_init: false # Zero-init last gate layer so initial alphas are uniform (1/M)

    # -----------------------------------------------------------------------
    # Phase 2: Student gatekeeper
    # -----------------------------------------------------------------------
    student_hidden_dims: [64, 32]
    student_epochs: 30
    student_lr: 1e-3
    student_batch_size: 256
    student_agreement_threshold: 0.98
    student_agreement_patience: 5
    student_weighted_ce: true
    student_balanced_sampler: false
    confidence_threshold: 0.3
    student_kd_alpha: 0.5
    student_kd_temperature: 4.0
    student_features_stats: true
    student_features_range_energy: true
    student_features_gradients: true

    # -----------------------------------------------------------------------
    # Phase 3: Final classifier
    # -----------------------------------------------------------------------
    use_mask_channel: false
    final_epochs: 100
    final_lr: 1e-4

# Optimizer (used for Teacher training; Student/Final have their own lr above)
optim:
    lr: 1e-4
    weight_decay: 1e-7
    epochs: 100
    grad_clip: 1.0
    patience: 10
    use_scheduler: true
    scheduler_T_max: 100
    scheduler_eta_min: 0.0

misc:
    seed: [0, 1, 2, 3, 4]
    log_every: 50
