# Pneumonia MNIST with Gumbel-Softmax Mixture-of-Experts (GS-MoE)
#
# This config runs a single-phase GS-MoE pipeline:
#   - RouterNetwork (MLP) produces per-patch routing logits over K kernels
#   - GumbelRouterBlock samples soft/hard masks via Gumbel-Softmax
#   - Classification head operates on masked quantum features
#
# 3-kernel variant: kings + horizontal + cross
# Direct comparison point against pneumonia_mnist_multi_seed_3kern.yml
# and pneumonia_mnist_ts_moe_3kern.yml

dataset:
  name: pneumonia_mnist
  data_root: ./data
  batch_size: 32
  num_workers: 2
  download: true
  color_space: GRAYSCALE

model:
  architecture: "gumbel"
  num_classes: 2
  kernel_size: 3
  stride: 3
  kernel_topology_names: ["kings", "horizontal", "cross"]
  scaling_factor: 1.0
  evolution_time: 2.5
  mode: trotter
  dropout: 0.5
  activation: gelu
  quantum_device: default.qubit
  quantum_device_kwargs: {}
  classical_device: auto

gumbel:
  # --- Router ---
  router_hidden_dim: null         # null = auto (max(M*N, 32))
  sparsity_weight: 0.01           # lambda for budget loss

  # --- Temperature annealing ---
  tau_start: 1.0                  # initial Gumbel temperature
  tau_end: 0.1                    # final Gumbel temperature (near-argmax)
  tau_anneal_epochs: 80           # epochs over which to decay tau exponentially

  # --- Hard switching ---
  hard_after_epoch: 80            # switch to hard=True (straight-through) after this epoch

optim:
  lr: 0.0001
  weight_decay: 1e-7
  epochs: 100
  grad_clip: 1.0
  patience: 15
  use_scheduler: false
  scheduler_T_max: 100
  scheduler_eta_min: 0.0

misc:
  seed: [0, 1, 2]
  log_every: 50
